x-db: &db
  image: postgres:17
  environment:
    POSTGRES_DB: articles
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: devpassword
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U postgres -d articles"]
    interval: 5s
    timeout: 5s
    retries: 10
    start_period: 30s

x-db-ready: &db-ready
  condition: service_healthy

services:
  db-africa:
    <<: *db
  db-antarctica:
    <<: *db
  db-asia:
    <<: *db
  db-europe:
    <<: *db
  db-northamerica:
    <<: *db
  db-oceania:
    <<: *db
  db-southamerica:
    <<: *db
  db-global:
    <<: *db

  db-profanity:
    image: postgres:17
    environment:
      POSTGRES_DB: profanity
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: devpassword
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d profanity"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  db-comments:
    image: postgres:17
    environment:
      POSTGRES_DB: comments
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: devpassword
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d comments"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  articleservice:
    build:
      context: .
      dockerfile: ArticleService/Dockerfile
    environment:
      Databases__Template: "Host={host};Port=5432;Database=articles;Username=postgres;Password=devpassword"
      Databases__Continents: "africa,antarctica,asia,europe,northamerica,oceania,southamerica,global"
    depends_on:
      db-africa: *db-ready
      db-antarctica: *db-ready
      db-asia: *db-ready
      db-europe: *db-ready
      db-northamerica: *db-ready
      db-oceania: *db-ready
      db-southamerica: *db-ready
      db-global: *db-ready

  loadbalancer:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:8080"
    depends_on:
      - articleservice

  profanityservice:
    build:
      context: .
      dockerfile: ProfanityService/Dockerfile
    environment:
      ConnectionStrings__Profanity: "Host=db-profanity;Port=5432;Database=profanity;Username=postgres;Password=devpassword"
    ports:
      - "8082:8080"
    depends_on:
      db-profanity: *db-ready

  commentservice:
    build:
      context: .
      dockerfile: CommentService/Dockerfile
    environment:
      ConnectionStrings__Comments: "Host=db-comments;Port=5432;Database=comments;Username=postgres;Password=devpassword"
      Services__Profanity: "http://profanityservice:8080"
    ports:
      - "8083:8080"
    depends_on:
      db-comments: *db-ready